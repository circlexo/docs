name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  links:
    # Checks every link between pages in this repository (offline: external sites are not fetched).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
